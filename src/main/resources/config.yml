# =========================================
# SHARD SHOP (mua bang Shards, dung plugin XShards)
# =========================================
shard-shop:
  icon: AMETHYST_SHARD

  # Chia khoa (item thuong, khong gan plugin nao khac, chi la ItemStack co ten/lore rieng)
  keys:
    common-key:
      material: TRIPWIRE_HOOK
      display-name: "&7Chia Khoa Thuong (Common Key)"
      price: 200
    gold-key:
      material: TRIPWIRE_HOOK
      display-name: "&6Chia Khoa Vang (Gold Key)"
      price: 1500
    amethyst-key:
      material: TRIPWIRE_HOOK
      display-name: "&dChia Khoa Ametit (Amethyst Key)"
      price: 4000

  # Spawner: khi mua se goi lenh cua SmartSpawner de dua dung loai mob cho nguoi choi
  # entity-type phai dung ten EntityType cua Bukkit (vd PIG, COW, ZOMBIE, ZOMBIFIED_PIGLIN...)
  spawners:
    pig-spawner:
      entity-type: PIG
      price: 250
    cow-spawner:
      entity-type: COW
      price: 350
    zombie-spawner:
      entity-type: ZOMBIE
      price: 400
    spider-spawner:
      entity-type: SPIDER
      price: 750
    skeleton-spawner:
      entity-type: SKELETON
      price: 500
    creeper-spawner:
      entity-type: CREEPER
      price: 625
    zombified-piglin-spawner:
      entity-type: ZOMBIFIED_PIGLIN
      price: 750
    blaze-spawner:
      entity-type: BLAZE
      price: 1000
    iron-golem-spawner:
      entity-type: IRON_GOLEM
      price: 1500

# =========================================
# TICH HOP PLUGIN NGOAI
# =========================================
integrations:
  # Lenh console de tru/cong Shards cua XShards - %player% va %amount% se duoc thay the
  xshards:
    check-balance-before-purchase: true
    remove-command: "shards remove %player% %amount%"
    give-command: "shards give %player% %amount%"
    balance-placeholder: "%xshards_playershards%"

  # Lenh console de SmartSpawner dua spawner dung loai mob cho nguoi choi
  smartspawner:
    give-command: "ss give %player% %entitytype% %amount%"
