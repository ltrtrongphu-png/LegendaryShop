# =========================================
# TICH HOP PLUGIN NGOAI
# =========================================
integrations:
  # Lenh console de tru/cong Shards cua XShards - %player% va %amount% se duoc thay the
  xshards:
    # Neu doc so du qua PlaceholderAPI bi sai (vd bao thieu Shards du ban co du),
    # dat false de bo qua buoc kiem tra truoc, chi dua vao lenh remove/give ben duoi.
    check-balance-before-purchase: true
    remove-command: "shards remove %player% %amount%"
    give-command: "shards give %player% %amount%"
    # Placeholder PlaceholderAPI de doc so du Shards hien tai cua nguoi choi
    # Da xac nhan dung: %xshards_balance% (kiem tra bang /papi parse <player> %xshards_balance%)
    balance-placeholder: "%xshards_balance%"

  # Lenh console de SmartSpawner dua spawner dung loai mob cho nguoi choi
  smartspawner:
    give-command: "ss spawner %player% %entitytype% %amount%"

