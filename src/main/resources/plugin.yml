name: LegendaryShop
version: '1.0.0'
main: com.example.legendaryshop.LegendaryShop
api-version: '1.21'
author: YourName
description: Plugin shop GUI - mua bang tien (Vault) hoac bang Shards (XShards), ho tro spawner qua SmartSpawner

softdepend: [Vault, PlaceholderAPI, XShards, SmartSpawner]

commands:
  shop:
    description: Mo GUI shop chinh
    usage: /<command>
    aliases: [legendaryshop, lshop]
  legendaryshopadmin:
    description: Lenh quan tri LegendaryShop
    usage: /legendaryshopadmin <reload>
    aliases: [lsadmin]
  sell:
    description: Ban vat pham dang cam tren tay
    usage: /<command>
  sellall:
    description: Ban tat ca vat pham hop le trong tui do
    usage: /<command>
  sellgui:
    description: Mo GUI keo tha vat pham de ban
    usage: /<command>

permissions:
  legendaryshop.use:
    description: Quyen dung lenh /shop
    default: true
  legendaryshop.admin:
    description: Quyen quan tri LegendaryShop (reload...)
    default: op
  legendaryshop.sell:
    description: Quyen dung /sell, /sellall, /sellgui
    default: true
